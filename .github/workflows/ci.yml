name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -v

      - name: Smoke test the analysis pipeline end to end
        run: |
          python generate_sample_logs.py
          python cli.py analyze data/sample_auth.log
          python cli.py analyze data/sample_access.log --type web
          python cli.py analyze data/sample_security.xml --type windows

  css:
    # The built stylesheet is committed so running the app needs no Node. This
    # fails when a template gains a class that the committed file lacks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Rebuild the stylesheet
        run: |
          npm ci
          npm run build:css

      - name: Confirm the committed stylesheet is current
        run: git diff --exit-code -- web/static/tailwind.css

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t seculogai:ci .

      - name: Confirm the container does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id seculogai:ci -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: Confirm the dashboard serves
        run: |
          docker run -d --name seculog -p 5000:5000 seculogai:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ > /dev/null; then
              echo "dashboard responded"
              docker rm -f seculog
              exit 0
            fi
            sleep 2
          done
          echo "dashboard did not respond in time; container logs:"
          docker logs seculog
          exit 1

      - name: Confirm the CLI runs inside the image
        run: |
          docker run --rm --entrypoint python seculogai:ci \
            -c "import generate_sample_logs as g; g.gen_auth_log('/tmp/a.log')"
