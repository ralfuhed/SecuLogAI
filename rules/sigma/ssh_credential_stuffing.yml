title: Multiple Distinct Usernames From One Source Over SSH
id: 348fc913-93e7-469d-bd26-afbedbb6122b
status: experimental
description: |
  Detects one source address attempting several different usernames, which
  distinguishes credential reuse and account enumeration from an ordinary user
  mistyping their own password. Mirrors detect_credential_stuffing() in
  analyzer/rule_engine.py.

  Mapped to the parent technique T1110 on purpose: an auth log never contains
  the password, so this pattern cannot be separated from password spraying
  (T1110.003) or plain enumeration. The rule title avoids claiming otherwise.
references:
  - https://attack.mitre.org/techniques/T1110/
author: ralfuhed
date: 2026/09/03
logsource:
  product: linux
  service: sshd
detection:
  failed_password:
    message|contains:
      - 'Failed password for'
      - 'Invalid user'
  timeframe: 60m
  condition: failed_password | count(user) by src_ip >= 4
fields:
  - src_ip
  - user
falsepositives:
  - A shared jump host where several people authenticate from one egress address
  - Automated tooling that legitimately tests multiple service accounts
level: high
tags:
  - attack.credential_access
  - attack.t1110
